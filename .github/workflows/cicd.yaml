name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.api-api-api.com
  HARBOR_PROJECT: downloader-sloniara-bot
  IMAGE_NAME: bot

jobs:
  build:
    runs-on: anomaly51-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image metadata
        run: |
          IMAGE_TAG="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"
          IMAGE_REF="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME || 'admin' }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD || 'admin' }}
        run: |
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" \
            --password-stdin

      - name: Ensure Harbor project exists
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME || 'admin' }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD || 'admin' }}
        run: |
          curl -fsS -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" \
            -H "Content-Type: application/json" \
            -X POST "https://${HARBOR_REGISTRY}/api/v2.0/projects" \
            -d "{\"project_name\":\"${HARBOR_PROJECT}\",\"public\":false}" \
            || true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REF }}
